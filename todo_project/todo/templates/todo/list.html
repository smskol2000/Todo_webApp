{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js "></script>
    <script src="{% static 'js/ajax.js' %}"></script>

</head>
<body>

<div class="todo-container">
    <h2>Todo App</h2>

    <!-- ADD TASK -->

    <form method="POST" id="add-form">
        {% csrf_token %}
        
        <div class="input-group">
            
            <input type="text" name="title" id="title" placeholder="Add your new Todo" required>
            <button type="submit" name="add_task" id="add-btn" class="add-btn">+</button>

        </div>
    </form>

    {% for todo in todos %}
    <div class="task">
        <div id="text-{{ todo.id }}" class="task-text">
            {{ todo.title }}
        </div>
       
        <!-- EDIT TASK  -->
    
        <form method="POST" id="edit-form-{{ todo.id }}" class="edit-form" style="display:none;">
            {% csrf_token %}
        
            <input type="hidden" name="task_id" value="{{ todo.id }}">
            <input type="text" name="new_title"  class="edit-input" value="{{ todo.title }}"required>    

            <button type="submit" name="edit_task" class=" btn btn-save">✔</button>

        </form>

        <div class="btn-group">

            <button type="button" id="{{todo.id }}" class="btn btn-edit">✏</button>


            <!-- DELETE TASK -->
    
            <form type="POST" id="delete-form-{{ todo.id }}">
                {% csrf_token %}

                <input type="hidden" name="task_id" value="{{ todo.id }}">

                <button type="submit" name="delete_task" class=" btn btn-delete">🗑</button>

            </form>
        </div>
    </div>

    {% empty %}
        <p>no tasks yet</p>
    {% endfor %}

     <!-- FOOTER -->
    <div class="footer">
        <span id="task-count">You have {{ task_count }} tasks</span>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" name="clear_all" id="clear-btn" class="clear-btn"> Clear All </button>
        </form>
     </div>
</div>



    
</body>
</html>
